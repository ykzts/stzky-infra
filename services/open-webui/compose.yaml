services:
  ovms:
    command: >
      --source_model OpenVINO/Qwen3.5-9B-int4-ov
      --model_name qwen3.5-9b
      --model_repository_path /models
      --task text_generation
      --target_device GPU
      --rest_port 8000
      --max_num_batched_tokens 32768
      --cache_size 8
    container_name: ovms
    devices:
      - /dev/dri:/dev/dri
    environment:
      HF_TOKEN: ${HF_TOKEN}
    group_add:
      - '993'
    image: openvino/model_server:2026.3-gpu@sha256:2a52cd2bc62d984f35f12b1cf58bb5dffe5f5d57b6ef3349b1b37229a768806b
    restart: always
    shm_size: 2gb
    volumes:
      - ovms-models:/models

  db:
    container_name: open-webui-db
    image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
    environment:
      POSTGRES_USER: webui
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: openwebui
    restart: always
    volumes:
      - pg-data:/var/lib/postgresql

  open-webui:
    container_name: open-webui
    depends_on:
      - ovms
      - db
    environment:
      DATABASE_URL: postgresql://webui:${DB_PASSWORD}@db:5432/openwebui
      ENABLE_SIGNUP: ${ENABLE_SIGNUP:-False}
      HF_TOKEN: ${HF_TOKEN}
      PGVECTOR_DB_URL: postgresql://webui:${DB_PASSWORD}@db:5432/openwebui
      VECTOR_DB: pgvector
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-}
    image: ghcr.io/open-webui/open-webui:v0.10.2@sha256:9fcea9c6e32ab60b0498f3986c6cdf651ddbe61db48d2213a3d28048ddd673d4
    networks:
      - default
      - stzky-ingress
    restart: always
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  ovms-models:
  pg-data:
  open-webui-data:

networks:
  stzky-ingress:
    external: true
