services:
  roonserver:
    container_name: roonserver
    environment:
      ROON_INSTALL_BRANCH: production
    image: ghcr.io/roonlabs/roonserver:1.0.8@sha256:6bd6a5d5eabffc1f711e313388dfb96927cad1b47ad6b57d19bf267d224e5600
    network_mode: host
    restart: always
    volumes:
      - roon-data:/Roon
      - ${ROON_SERVER_MUSIC_DIR}:/Music
      - ${ROON_SERVER_BACKUP_DIR}:/RoonBackups

  alloy:
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    container_name: roonserver_alloy
    image: grafana/alloy:v1.18.1@sha256:0f4434c92b3e6cdac38bb129b344e1790c246f7b6e2eaffcc16a5fa363240e33
    networks:
      - stzky-ingress
    restart: always
    user: '0'
    volumes:
      - roon-data:/Roon:ro
      - ./config/alloy:/etc/alloy:ro

volumes:
  roon-data:

networks:
  stzky-ingress:
    external: true
