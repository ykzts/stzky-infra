name: epub-web

services:
  epub-web:
    container_name: epub-web
    platform: linux/amd64
    environment:
      EPUB_WEB_MAX_UPLOAD_SIZE: 256
      EPUB_WEB_MAX_PAGES: 500
      EPUB_WEB_WORKERS: 8
      EPUB_WEB_REQUEST_TIMEOUT: 90s
      EPUB_WEB_SHUTDOWN_TIMEOUT: 15s
      EPUB_WEB_PUBLIC_URL: https://epub.publira.dev
    image: ghcr.io/publira/epub-web:1.3.1@sha256:ef415959d195d0a88a2c76e5c7320281b622706e3d0e92190fa481ce130e7940
    networks:
      - default
      - stzky-ingress
    restart: always

networks:
  stzky-ingress:
    external: true
