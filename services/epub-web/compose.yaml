name: epub-web

services:
  epub-web:
    container_name: epub-web
    platform: linux/amd64
    environment:
      EPUB_WEB_MAX_UPLOAD_SIZE: 256
      EPUB_WEB_MAX_PAGES: 500
      EPUB_WEB_WORKERS: 8
      EPUB_WEB_REQUEST_TIMEOUT: 90s
      EPUB_WEB_SHUTDOWN_TIMEOUT: 15s
      EPUB_WEB_PUBLIC_URL: https://epub.publira.dev
    image: ghcr.io/publira/epub-web:1.3.0@sha256:266c1c823677ab8487b5383596e1ba6dfd7b47a967cc16272cd228b909b49ca9
    networks:
      - default
      - stzky-ingress
    restart: always

networks:
  stzky-ingress:
    external: true
