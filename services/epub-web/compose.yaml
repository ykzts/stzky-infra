name: epub-web

services:
  epub-web:
    container_name: epub-web
    platform: linux/amd64
    environment:
      EPUB_WEB_MAX_UPLOAD_SIZE: 256
      EPUB_WEB_MAX_PAGES: 500
      EPUB_WEB_WORKERS: 8
      EPUB_WEB_REQUEST_TIMEOUT: 90s
      EPUB_WEB_SHUTDOWN_TIMEOUT: 15s
    image: ghcr.io/publira/epub-web:1.2.0@sha256:3fca553b5c64cc14d8471c365e82b0bc526a93dea2c51f4db702f0892a05cc7e
    networks:
      - default
      - stzky-ingress
    restart: always

networks:
  stzky-ingress:
    external: true
