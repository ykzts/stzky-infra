services:
  firecrawl:
    command: ['node', 'dist/src/harness.js', '--start-docker']
    container_name: firecrawl
    image: ghcr.io/firecrawl/firecrawl:2.11.607@sha256:1969a758092e9abdc9a6eff959cf3d4197ffcd0ba74c98c1db005f4ba61b50db
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      USE_DB_AUTHENTICATION: false
      REDIS_URL: redis://firecrawl-redis:6379
      REDIS_RATE_LIMIT_URL: redis://firecrawl-redis:6379
      PLAYWRIGHT_MICROSERVICE_URL: http://firecrawl-playwright:3000/scrape
      NUQ_RABBITMQ_URL: amqp://firecrawl-rabbitmq:5672
      POSTGRES_HOST: firecrawl-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-firecrawl}
      BULL_AUTH_KEY: ${FIRECRAWL_BULL_AUTH_KEY:-CHANGEME}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 60s
      test: ['CMD', 'node', '-e', 'fetch(''http://127.0.0.1:3002/e2e-test'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      timeout: 5s
    depends_on:
      firecrawl-redis:
        condition: service_started
      firecrawl-rabbitmq:
        condition: service_healthy
      firecrawl-playwright:
        condition: service_started
      firecrawl-postgres:
        condition: service_healthy
    networks:
      - default
      - stzky-ingress
    cpus: 2
    init: true
    mem_limit: 4g
    restart: always
    security_opt:
      - no-new-privileges

  firecrawl-playwright:
    container_name: firecrawl-playwright
    image: ghcr.io/firecrawl/playwright-service:latest@sha256:6b54a9733fe6863c2dc225bf8e284db996ef59f6efd5d1e760f0664c09c1f856
    environment:
      PORT: 3000
    cpus: 1
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ['CMD', 'node', '-e', 'fetch(''http://127.0.0.1:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      timeout: 5s
    init: true
    mem_limit: 2g
    restart: always
    security_opt:
      - no-new-privileges

  firecrawl-redis:
    command: ['redis-server', '--bind', '0.0.0.0']
    container_name: firecrawl-redis
    cpus: 1
    image: redis:8.10-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
    healthcheck:
      interval: 5s
      retries: 5
      test: ['CMD', 'redis-cli', 'ping']
      timeout: 5s
    init: true
    mem_limit: 1g
    restart: always
    security_opt:
      - no-new-privileges

  firecrawl-rabbitmq:
    container_name: firecrawl-rabbitmq
    image: rabbitmq:4.4.0-management-alpine@sha256:0452ee3fd3b9a74160b251e693338616b464f22df4d4ba43304c101bebdca292
    init: true
    restart: always
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_running']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    cpus: 1
    mem_limit: 1g
    security_opt:
      - no-new-privileges

  firecrawl-postgres:
    command: ['postgres', '-c', 'cron.database_name=firecrawl']
    container_name: firecrawl-postgres
    image: ghcr.io/firecrawl/nuq-postgres:latest@sha256:5a0be88215431b8dd57ae5d701ee191521cd1ac8e882a65558ae95c4587c57cb
    environment:
      POSTGRES_USER: ${FIRECRAWL_POSTGRES_USER:-firecrawl}
      POSTGRES_PASSWORD: ${FIRECRAWL_POSTGRES_PASSWORD:-firecrawl_password}
      POSTGRES_DB: ${FIRECRAWL_POSTGRES_DB:-firecrawl}
    volumes:
      - firecrawl-nuq-postgres-data:/var/lib/postgresql/data
    init: true
    restart: always
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${FIRECRAWL_POSTGRES_USER:-firecrawl}', '-d', '${FIRECRAWL_POSTGRES_DB:-firecrawl}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    cpus: 1
    mem_limit: 2g
    security_opt:
      - no-new-privileges

volumes:
  firecrawl-nuq-postgres-data:

networks:
  stzky-ingress:
    external: true
