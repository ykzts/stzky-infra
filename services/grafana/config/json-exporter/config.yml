modules:
  immich_statistics:
    http_client_config:
      http_headers:
        x-api-key:
          files: [/run/secrets/immich_api_key]
    metrics:
      - name: immich_assets
        help: Number of assets in Immich.
        labels:
          type: photo
        path: '{.photos}'
        valuetype: gauge
      - name: immich_assets
        help: Number of assets in Immich.
        labels:
          type: video
        path: '{.videos}'
        valuetype: gauge
      - name: immich_usage_bytes
        help: Storage used by assets in Immich, in bytes.
        labels:
          type: photo
        path: '{.usagePhotos}'
        valuetype: gauge
      - name: immich_usage_bytes
        help: Storage used by assets in Immich, in bytes.
        labels:
          type: video
        path: '{.usageVideos}'
        valuetype: gauge
