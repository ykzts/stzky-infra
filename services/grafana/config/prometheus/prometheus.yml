global:
  scrape_interval: 15s

scrape_configs:
  - static_configs:
      - targets: ['cadvisor:8080']
    job_name: cadvisor

  - static_configs:
      - targets: ['grafana:3000']
    job_name: grafana

  - metrics_path: /probe
    params:
      module: [immich_statistics]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: json-exporter:7979
    scrape_interval: 5m
    static_configs:
      - targets: ['http://immich-server:2283/api/server/statistics']
    job_name: immich_statistics

  - static_configs:
      - targets: ['json-exporter:7979']
    job_name: json_exporter

  - static_configs:
      - targets: ['node-exporter:9100']
    job_name: node

  - static_configs:
      - targets: ['localhost:9090']
    job_name: prometheus

  - metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [yamaha_rt]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
    static_configs:
      - targets: [192.168.100.1]
    job_name: snmp

  - metrics_path: /snmp
    params:
      auth: [public_v2]
      module: [if_traffic]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: [192.168.100.1]
    job_name: snmp_if

  - static_configs:
      - targets: ['snmp-exporter:9116']
    job_name: snmp_exporter
