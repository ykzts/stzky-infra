services:
  alloy:
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    container_name: alloy
    environment:
      ALLOY_PROMETHEUS_PASSWORD: ${ALLOY_PROMETHEUS_PASSWORD}
      ALLOY_PROMETHEUS_USERNAME: ${ALLOY_PROMETHEUS_USERNAME}
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf "GET /-/ready HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q 200']
      timeout: 5s
    image: grafana/alloy:v1.21.0@sha256:9726bfba078de9bc2212c60c6e643238c700b4fe0868ea78cbe03163d03d95bf
    networks:
      - default
      - stzky-ingress
    restart: always
    user: '0'
    volumes:
      - ./config/alloy:/etc/alloy:ro
      - alloy_data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro

  cadvisor:
    container_name: cadvisor
    devices:
      - /dev/kmsg:/dev/kmsg
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    privileged: true
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  database:
    container_name: grafana_postgres
    environment:
      POSTGRES_DB: ${GF_DATABASE_NAME}
      POSTGRES_PASSWORD: ${GF_DATABASE_PASSWORD}
      POSTGRES_USER: ${GF_DATABASE_USER}
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${GF_DATABASE_USER}', '-d', '${GF_DATABASE_NAME}']
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: always
    volumes:
      - /opt/grafana/postgres:/var/lib/postgresql/data

  grafana:
    container_name: grafana
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GF_AUTH_DISABLE_LOGIN_FORM: true
      GF_DATABASE_HOST: ${GF_DATABASE_HOST}
      GF_DATABASE_NAME: ${GF_DATABASE_NAME}
      GF_DATABASE_PASSWORD: ${GF_DATABASE_PASSWORD}
      GF_DATABASE_TYPE: ${GF_DATABASE_TYPE}
      GF_DATABASE_USER: ${GF_DATABASE_USER}
      GF_REMOTE_CACHE_CONNSTR: ${GF_REMOTE_CACHE_CONNSTR}
      GF_REMOTE_CACHE_TYPE: redis
      GF_SECURITY_COOKIE_SECURE: true
      GF_SECURITY_COOKIE_SAMESITE: Strict
      GF_SECURITY_CONTENT_SECURITY_POLICY: true
      GF_SERVER_DOMAIN: graph.stzky.com
      GF_SERVER_ROOT_URL: https://graph.stzky.com
      GF_SERVER_ENABLE_GZIP: false
      GF_SMTP_ENABLED: true
      GF_SMTP_FROM_ADDRESS: ${GF_SMTP_FROM_ADDRESS}
      GF_SMTP_FROM_NAME: ${GF_SMTP_FROM_NAME}
      GF_SMTP_HOST: ${GF_SMTP_HOST}
      GF_SMTP_PASSWORD: ${GF_SMTP_PASSWORD}
      GF_SMTP_USER: ${GF_SMTP_USER:-resend}
      GF_SNAPSHOTS_EXTERNAL_ENABLED: false
      GF_USERS_DEFAULT_THEME: system
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ['CMD', 'wget', '--spider', '-q', '--tries=1', 'http://127.0.0.1:3000/api/health']
      timeout: 5s
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    networks:
      - default
      - stzky-ingress
    restart: always
    user: '0'
    volumes:
      - /opt/grafana/grafana:/var/lib/grafana

  json-exporter:
    command:
      - --config.file=/etc/json_exporter/config.yml
    container_name: json_exporter
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ['CMD', 'wget', '--spider', '-q', '--tries=1', 'http://127.0.0.1:7979/metrics']
      timeout: 5s
    image: quay.io/prometheuscommunity/json-exporter:v0.8.0@sha256:3aad20d41a0b31dfaaf7ab1a091440e92a82a61ef68b76750eac0ad50a983652
    networks:
      - default
      - stzky-ingress
    restart: always
    secrets:
      - immich_api_key
    volumes:
      - ./config/json-exporter:/etc/json_exporter:ro

  loki:
    command: -config.file=/etc/loki/local-config.yaml
    container_name: loki
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 30s
      test: ['CMD', '/bin/loki', '-health']
      timeout: 10s
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    networks:
      - default
      - stzky-ingress
    restart: always
    volumes:
      - ./config/loki:/etc/loki:ro
      - loki_data:/loki

  node-exporter:
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    container_name: node_exporter
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    pid: host
    restart: always
    volumes:
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=60d
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    container_name: prometheus
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 10s
      test: ['CMD', 'wget', '--spider', '-q', '--tries=1', 'http://127.0.0.1:9090/-/healthy']
      timeout: 5s
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    networks:
      - default
      - stzky-ingress
    restart: always
    volumes:
      - ./config/prometheus:/etc/prometheus:ro
      - /opt/grafana/prometheus:/prometheus

  redis:
    container_name: grafana_redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
    image: valkey/valkey:8.1.3-bookworm@sha256:fea8b3e67b15729d4bb70589eb03367bab9ad1ee89c876f54327fc7c6e618571
    restart: always
    volumes:
      - /opt/grafana/redis:/data

  snmp-exporter:
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --config.file=/etc/snmp_exporter/if_traffic.yml
    container_name: snmp_exporter
    image: prom/snmp-exporter:v0.30.1@sha256:e5fd5e8b43ace6c088fe9bf0b37b7fff0e04380bee352be7ec41b853a4dd5859
    restart: always
    volumes:
      - ./config/snmp-exporter/if_traffic.yml:/etc/snmp_exporter/if_traffic.yml:ro

networks:
  stzky-ingress:
    external: true

secrets:
  immich_api_key:
    environment: IMMICH_STATISTICS_API_KEY

volumes:
  alloy_data:
  loki_data:
