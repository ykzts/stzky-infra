services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: stzky.com
      LOG_TARGETS: stdout
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 20s
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/healthcheck']
      timeout: 3s
    image: ghcr.io/gethomepage/homepage:v2.7.0@sha256:19c5c09184458a41b7b5915e71463a39f36cd33540f41bdbed008791b8182d5f
    networks:
      - default
      - stzky-ingress
    restart: always
    volumes:
      - ./config/homepage:/app/config:ro
      - ./public/images:/app/public/images:ro

networks:
  stzky-ingress:
    external: true
