services:
  homepage:
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: stzky.com
      LOG_TARGETS: stdout
    healthcheck:
      interval: 10s
      retries: 5
      start_period: 20s
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/healthcheck']
      timeout: 3s
    image: ghcr.io/gethomepage/homepage:v2.3.0@sha256:f820276654539cdc2cf0169f28188d135919a7984fad76d83d8d5ff1383f3705
    networks:
      - default
      - stzky-ingress
    restart: always
    volumes:
      - ./config/homepage:/app/config:ro
      - ./public/images:/app/public/images:ro

networks:
  stzky-ingress:
    external: true
